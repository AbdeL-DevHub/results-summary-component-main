<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css"/>
   <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans+Arabic:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="container">
    <div class="result">
      <h3>Your Result</h3>
      <div class="circle">
        <span>76</span>
        <span>of 100</span>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h3>Summary</h3>
     <div class="reaction">
      <span>Reaction</span>
      <div class="value">
        <span>80</span>
        <span>/ 100</span>
      </div>
      
     </div>
     <div class="memory">
     <span>Memory</span>
     <div class="value">
      <span>92</span>
      <span>/ 100</span>
     </div>
     
     </div>
     <div class="verbal">
     <span>Verbal</span>
     <div class="value">
      <span>61</span>
      <span>/ 100</span>
     </div>
     
     </div>
     <div class="visual">
     <span>Visual</span>
     <div class="value">
       <span>73</span>
       <span>/ 100</span>

     </div>
     
     </div>
      <button>Continue</button>

    </div>
  </div>

</body>
</html>
